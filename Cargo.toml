[package]
name = "kronos"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"

[dependencies]
gettext-rs = { version = "0.7", features = ["gettext-system"] }
gtk = { version = "0.11.4", package = "gtk4", features = ["gnome_50"] }

[dependencies.adw]
package = "libadwaita"
version = "0.9.1"
features = ["v1_9"]
